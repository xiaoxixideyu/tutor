<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor 导师 · 进度看板</title>
<link rel="stylesheet" href="/research-progress.css">
<link rel="stylesheet" href="/ui/home.css">
</head>
<body>
<header>
  <h1>tutor 导师</h1>
  <p>查看学习进度，继续课程与到期复习。　<a href="/app.html" style="color:var(--accent)">工作区</a>　<a href="/wizard.html" style="color:var(--accent)">＋ 开设新课程</a>　<a href="/settings.html" style="color:var(--accent)">模型设置</a></p>
</header>
<main>
  <section id="researchLive" hidden></section>
  <section id="panel"></section>
</main>
<script src="/research-progress.js"></script>
<script src="/ui/dom.js"></script>
<script src="/ui/rpc.js"></script>
<script src="/ui/views/home.js"></script>
<script>
// 独立看板页与单壳共用同一个看板视图控制器（static/ui/views/home.js）。
let dashboard = null
const researchLive = new TutorResearchProgress(document.getElementById('researchLive'), (id) => {
  dashboard?.showCourse(id).catch(() => {})
})
dashboard = TutorViews.home({
  root: document.getElementById('panel'),
  researchLive,
  courseId: new URLSearchParams(location.search).get('course') ?? undefined,
})
</script>
</body>
</html>
