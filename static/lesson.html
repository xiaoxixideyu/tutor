<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor 导师 · 课堂</title>
<style>
  :root {
    --fg: #1a1d21; --muted: #6b7280; --bg: #f6f7f9; --card: #fff; --border: #e4e7ec;
    --accent: #2563eb; --green: #16a34a; --yellow: #d97706; --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { margin: 0; font-size: 16px; flex: 1; }
  header .state { font-size: 12px; color: var(--muted); }
  header button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
  header button.danger { color: var(--red); }
  header button:hover { background: var(--bg); }
  header a.backlink { text-decoration: none; color: var(--muted); font-size: 13px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; }
  header a.backlink:hover { background: var(--bg); }
  #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; margin: 0 auto; width: 100%; }
  .bubble { margin-bottom: 14px; }
  .tutor { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; line-height: 1.65; font-size: 14px; }
  .tutor h1, .tutor h2, .tutor h3 { font-size: 14px; margin: 12px 0 6px; }
  .tutor pre { background: #0d1117; color: #e6edf3; border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; margin: 8px 0; white-space: pre; }
  .tutor code { background: #eef1f5; border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .tutor pre code { background: none; padding: 0; }
  .tutor ul, .tutor ol { margin: 6px 0; padding-left: 22px; }
  .tutor li { margin: 3px 0; }
  .tutor p { margin: 6px 0; }
  .tutor strong { font-weight: 600; }
  .busy { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 13px; }
  .busy .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .cost { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .cost .g { color: var(--green); } .cost .y { color: var(--yellow); } .cost .r { color: var(--red); }
  .cost .g-g { color: var(--green); } .cost .r-y { color: var(--yellow); } .cost .r-r { color: var(--red); }
  .userline { text-align: right; color: var(--muted); font-size: 13px; margin: 8px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
  .chip { background: var(--card); border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; user-select: none; }
  .chip:hover { background: #eef2ff; }
  .chip.selected { background: var(--accent); color: #fff; }
  .chip.disabled { opacity: .55; cursor: default; }
  .chips .hint { font-size: 12px; color: var(--muted); align-self: center; }
  .errline { color: var(--red); font-size: 13px; white-space: pre-wrap; }
  .sysline { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .opstatus { display: none; max-width: 860px; margin: 8px auto 0; width: 100%; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  footer { border-top: 1px solid var(--border); background: var(--card); padding: 12px 20px; }
  .inputrow { display: flex; gap: 8px; max-width: 860px; margin: 0 auto; width: 100%; }
  .inputrow input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .inputrow button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 14px; }
  .quick { max-width: 860px; margin: 8px auto 0; display: flex; gap: 8px; }
  .quick button { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; font-size: 12px; cursor: pointer; color: var(--fg); }
  .quick button:hover { background: #eef2ff; }
  .banner { background: #fef3c7; color: #92400e; padding: 8px 20px; font-size: 13px; display: none; }
</style>
</head>
<body>
<header>
  <a href="/" class="backlink">← 课程列表</a>
  <h1>课堂</h1>
  <span class="state" id="state">未连接</span>
  <span class="busy" id="busy" style="display:none"><span class="dot"></span><span id="busyText">等待模型回复…</span></span>
  <a href="/settings.html" class="backlink" target="_blank" rel="noopener">模型设置</a>
  <button id="stopBtn" class="danger">暂停本课</button>
</header>
<div class="banner" id="banner"></div>
<main id="log"></main>
<footer>
  <div class="quick">
    <button data-cmd="看不懂，换个讲法">换个讲法</button>
    <button data-cmd="给个提示">提示</button>
    <button data-cmd="/quiz">单元小测 /quiz</button>
    <button data-cmd="/check">内容核对 /check</button>
  </div>
  <div class="opstatus" id="opstatus"></div>
  <div class="inputrow" style="margin-top:8px">
    <input id="input" placeholder="输入你的回答…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </div>
</footer>
<script src="/md.js"></script>
<script src="/flow-client.js"></script>
<script>
const flowClient = new TutorFlowClient((message) => {
  setBusy(false)
  $log.appendChild(el(`<div class="errline">${esc(message)}</div>`))
})
const $log = document.getElementById('log')
const $input = document.getElementById('input')
const $state = document.getElementById('state')
const $banner = document.getElementById('banner')
let activeCourse = null

function el(html) {
  const div = document.createElement('div')
  div.innerHTML = html
  return div.firstChild
}

function esc(text) {
  const div = document.createElement('div')
  div.textContent = String(text ?? '')
  return div.innerHTML
}

// 只在已贴近底部时才自动滚动——用户上翻回看讲解时不被拽到底
function scrollToEnd() {
  if ($log.scrollHeight - $log.scrollTop - $log.clientHeight < 120) $log.scrollTop = $log.scrollHeight
}

function colorizeCost(text) {
  const div = document.createElement('div')
  div.className = 'cost'
  let html = esc(text)
  html = html.replace(/¥([0-9.]+)/g, (m, n) => {
    const v = Number(n)
    const cls = v >= 0.2 ? 'r-r' : v >= 0.05 ? 'r-y' : 'g-g'
    return `<span class="${cls}">¥${n}</span>`
  })
  div.innerHTML = html
  return div
}

const COST_RE = /^(本回合|会话累计)/
const PROMPT_RE = /^>$/
// 引擎内部运行提示（限流等待、内容审查、备课、成本等）——学员视图不显示为教学气泡，只在一条安静的状态条里显示当前进度。
const OP_OUT_RE = /^(正在备课[：:]|备课完成|正在从可用的已审查内容恢复课堂|内容审查[ 　]|审查开销[ 　]|复用同一内容的|正在核对|[^\n]{0,12}核查中[：:]|资料审查达到|正在汇总本知识点|正在核对本知识点)/
const OP_ERR_RE = /(等待渠道额度|渠道暂时|重新检查共享额度)/
function cleanOp(text) {
  return String(text ?? '').replace(/^tutor:\s*/, '').replace(/\s*；已保存的教研进度保留。?\s*$/, '').trim()
}
function noteOp(text) {
  const t = cleanOp(text)
  if (!t) return
  const $op = document.getElementById('opstatus')
  $op.textContent = '⏳ ' + t
  $op.style.display = 'block'
}
function clearOp() {
  const $op = document.getElementById('opstatus')
  $op.textContent = ''
  $op.style.display = 'none'
}

let pending = ''
let bubble = null
let bubbleText = ''
let busy = false
let flowFinished = true
let busyTimer = null
let busySeconds = 0
let chips = null

function setBusy(on, label) {
  busy = on
  const $busy = document.getElementById('busy')
  const $send = document.getElementById('send')
  if (busyTimer) { clearInterval(busyTimer); busyTimer = null }
  $input.disabled = on || flowFinished
  if ($send) $send.disabled = on || flowFinished
  for (const button of document.querySelectorAll('.quick button')) button.disabled = on || flowFinished
  document.getElementById('stopBtn').disabled = flowFinished
  if (on || flowFinished) for (const button of $log.querySelectorAll('.choices button')) button.disabled = true
  if (on) {
    busySeconds = 0
    document.getElementById('busyText').textContent = label ?? '等待模型回复… 0s'
    $busy.style.display = 'inline-flex'
    busyTimer = setInterval(() => {
      busySeconds++
      document.getElementById('busyText').textContent = `${label ?? '等待模型回复'}… ${busySeconds}s`
    }, 1000)
  } else {
    $busy.style.display = 'none'
    // 轮到你了：正向提示（讲完与卡死不再长得一样）
    $input.placeholder = '轮到你了，输入回答…（Enter 发送）'
    $input.focus()
  }
}

// 共享实现见 static/md.js（课堂/考试/复习三页共用同一渲染器）
const mdToHtml = window.TutorMd.toHtml


function renderBubble() {
  if (!bubble || !bubbleText) return
  bubble.innerHTML = mdToHtml(bubbleText)
}

function optionLinesOf(text) {
  const out = []
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*([A-Fa-f])[.、．]\s*(\S.*)$/)
    if (m) out.push({ letter: m[1].toUpperCase(), label: m[2].trim() })
  }
  return out
}

function maybeChips(text) {
  const options = optionLinesOf(text)
  if (options.length < 2 || options.length > 6) return
  // 单个问题（一组连续字母）
  const letters = options.map((o) => o.letter)
  const expects = ['A', 'B', 'C', 'D', 'E', 'F'].slice(0, letters.length)
  if (letters.join('') !== expects.join('')) return
  // 下一题出现后，旧题按钮也不能再次提交。
  for (const button of $log.querySelectorAll('.choices button')) button.disabled = true
  const multi = /可多选|可多選|多选题|（多选）|\(多选\)/.test(text)
  const container = el('<div class="chips choices"></div>')
  const chipSelection = []
  let chipsAnswered = false
  if (multi) container.appendChild(el('<span class="hint">可多选，选完点「提交选择」</span>'))
  for (const opt of options) {
    const chip = el(`<button class="chip">${esc(opt.letter)}. ${esc(opt.label)}</button>`)
    chip.addEventListener('click', () => {
      if (chipsAnswered || busy || flowFinished) return
      if (multi) {
        const idx = chipSelection.indexOf(opt.letter)
        if (idx >= 0) chipSelection.splice(idx, 1)
        else chipSelection.push(opt.letter)
        chip.classList.toggle('selected')
      } else {
        chipsAnswered = true
        for (const c of container.querySelectorAll('.chip')) c.classList.add('disabled')
        chip.classList.add('selected')
        submitChips([opt.letter])
      }
    })
    container.appendChild(chip)
  }
  if (multi) {
    const submit = el('<button class="chip">提交选择</button>')
    submit.addEventListener('click', () => {
      if (chipsAnswered || busy || flowFinished || chipSelection.length === 0) return
      chipsAnswered = true
      for (const c of container.querySelectorAll('.chip')) c.classList.add('disabled')
      submitChips(chipSelection)
    })
    container.appendChild(submit)
  }
  $log.appendChild(container)
  $log.scrollTop = $log.scrollHeight
}

function submitChips(letters) {
  if (busy || flowFinished) return
  const line = letters.join('')
  $log.appendChild(el(`<div class="userline">你：${esc(line)}</div>`))
  closeBubble()
  setBusy(true)
  api('/flow/input', { line })
}

function closeBubble() {
  if (bubble) renderBubble()
  const text = bubbleText
  bubble = null
  bubbleText = ''
  return text
}

function handleLine(line) {
  const trimmed = line.trim()
  if (trimmed === '>') {
    const closed = closeBubble()
    if (closed) maybeChips(closed)
    clearOp()
    setBusy(false)
    return
  }
  if (OP_OUT_RE.test(trimmed)) { noteOp(trimmed); return }
  if (COST_RE.test(line)) {
    closeBubble()
    $log.appendChild(colorizeCost(line))
    return
  }
  if (trimmed === '') return
  if (!bubble) {
    clearOp()
    bubble = el('<div class="tutor"></div>')
    $log.appendChild(bubble)
  }
  bubbleText += (bubbleText ? '\n' : '') + line
  bubble.textContent = bubbleText
  scrollToEnd()
}

function feed(text) {
  pending += text
  let idx
  while ((idx = pending.indexOf('\n')) >= 0) {
    const line = pending.slice(0, idx)
    pending = pending.slice(idx + 1)
    handleLine(line)
  }
  if (pending.trim() === '>') {
    handleLine('>')
    pending = ''
  }
}

// 上课以 code 0 退出（讲完一节或主动暂停）后的续接：给「继续上课 / 返回课程列表」两个入口，
// 而不是显示死板的「已结束」。继续＝对同一门课重新起 learn，runner 会从 plan.current 续到下一节
// （若是暂停则续回本节草稿）。
function renderLearnContinue(failed = false) {
  const courseId = activeCourse || new URLSearchParams(location.search).get('course')
  const row = el('<div class="chips"></div>')
  const back = el('<button class="chip">← 课程列表</button>')
  back.addEventListener('click', () => { location.href = '/' })
  if (courseId) {
    const cont = el(`<button class="chip">${failed ? '从已保存进度重试 →' : '继续上课 →'}</button>`)
    cont.addEventListener('click', async () => {
      if (busy) return
      row.remove()
      setBusy(true, '正在准备本课并核对内容')
      const result = await api('/flow/start', { kind: 'learn', courseId })
      if (!result.ok) {
        setBusy(false)
        $log.appendChild(el(`<div class="errline">${esc(result.error || '继续失败')}</div>`))
        return
      }
      $state.textContent = `课堂进行中：${courseId}`
    })
    row.appendChild(cont)
  }
  row.appendChild(back)
  $log.appendChild(row)
  scrollToEnd()
}

function setUserEcho(line) {
  const div = el(`<div class="userline">你：${esc(line)}</div>`)
  $log.appendChild(div)
  $log.scrollTop = $log.scrollHeight
}

async function startSse() {
  const es = flowClient.connect()
  if (!es) return
  es.onmessage = (event) => {
    const msg = JSON.parse(event.data)
    if (msg.type === 'hello' && msg.replay === undefined) {
      // hello 后紧接重放历史：清空当前视图避免重复
      $log.innerHTML = ''
      pending = ''
      bubble = null
      bubbleText = ''
      activeCourse = msg.courseId
      flowFinished = msg.status !== 'running' && msg.status !== 'stopping'
      setBusy(!flowFinished, '正在恢复课堂')
      $state.textContent = msg.courseId ? `课堂进行中：${msg.courseId}` : '空闲'
      if (!msg.courseId) $banner.style.display = 'block'
      return
    }
    if (msg.type === 'out') feed(msg.text)
    else if (msg.type === 'err') { if (OP_ERR_RE.test(msg.text)) noteOp(msg.text); else $log.appendChild(el(`<div class="errline">${esc(msg.text)}</div>`)) }
    else if (msg.type === 'exit') {
      feed('')
      const closed = closeBubble()
      if (closed) maybeChips(closed)
      flowFinished = true
      clearOp()
      setBusy(false)
      if (msg.kind === 'learn' && msg.code === 0) {
        // learn 每讲完一节 / 暂停都以 0 退出——给「继续上课 / 返回」入口，别让用户以为课程结束了
        $state.textContent = '本节告一段落'
        renderLearnContinue()
      } else {
        $state.textContent = '已结束'
        $log.appendChild(el(`<div class="sysline">—— 课堂进程退出（code ${msg.code}）——</div>`))
        if (msg.kind === 'learn') renderLearnContinue(true)
      }
    }
    scrollToEnd()
  }
  es.onerror = () => {
    $state.textContent = '连接中断，重连中…'
    setBusy(false)
  }
}

async function api(path, body) {
  const result = await flowClient.request(path, body)
  if (path === '/flow/start' && result.ok) { flowFinished = false; startSse() }
  return result
}

async function findLessonFlow() {
  const state = await flowClient.state()
  if (!state) return undefined
  const flows = state.flows ?? []
  const learnFlows = flows.filter((flow) => flow.kind === 'learn')
  const mine = wanted ? learnFlows.find((flow) => flow.courseId === wanted) : learnFlows[0]
  if (mine) return { flow: mine, busy: null }
  // 同一门课被别的流程占用（同课程互斥）；其他课程的流程与本页无关，可并行运行。
  const busy = wanted ? flows.find((flow) => flow.courseId === wanted) : null
  return { flow: null, busy: busy ?? null }
}

function send() {
  if (busy || flowFinished) return
  const line = $input.value.trim()
  if (!line) return
  $input.value = ''
  setUserEcho(line)
  closeBubble()
  setBusy(true)
  api('/flow/input', { line })
}

document.getElementById('send').addEventListener('click', send)
$input.addEventListener('keydown', (event) => {
  // isComposing 守卫：中文输入法回车选字时不误发半成品
  if (event.key === 'Enter' && !event.isComposing) send()
})
for (const button of document.querySelectorAll('.quick button')) {
  button.addEventListener('click', () => {
    if (busy || flowFinished) return
    setUserEcho(button.dataset.cmd)
    setBusy(true)
    api('/flow/input', { line: button.dataset.cmd })
  })
}
document.getElementById('stopBtn').addEventListener('click', async () => {
  await api('/flow/stop')
})

// 同一门课程同时只能运行一个流程；不同课程的流程可以并行，不进本页的切换提示。
function renderCourseMismatch(runningFlow, wanted) {
  if (!flowClient.attach(runningFlow)) return
  const running = runningFlow.courseId
  const kind = { new: '需求访谈', assess: '摸底测评', plan: '教学规划', research: '教研',
    learn: '课堂', exam: '里程碑大考', 'practice-gen': '实践任务生成', practice: '实践' }[runningFlow.kind] || '教学流程'
  $state.textContent = `${kind}进行中：${running}`
  $banner.innerHTML = ''
  $banner.appendChild(document.createTextNode(
    `「${running}」正在进行${kind}。同一门课程同时只能运行一个流程；开始本课课堂前，需要先结束它。`))
  const btn = el(`<button style="margin-top:8px;cursor:pointer">结束当前流程并开始「${esc(wanted)}」课堂</button>`)
  btn.addEventListener('click', async () => {
    btn.disabled = true
    btn.textContent = `正在结束${kind}…`
    const stopped = await api('/flow/stop')
    if (!stopped.ok) { btn.disabled = false; btn.textContent = '重试切换'; return }
    // 等旧流程真正结束（该课程的槽位释放）再起新课，否则会撞「已有进行中的流程」
    for (let i = 0; i < 40; i++) {
      const s = await flowClient.state()
      if (!s) { btn.disabled = false; return }
      if (!(s.flows ?? []).some((flow) => flow.courseId === running)) break
      await new Promise((r) => setTimeout(r, 500))
    }
    const result = await api('/flow/start', { kind: 'learn', courseId: wanted })
    if (!result.ok) { $banner.textContent = result.error || '切换失败'; btn.disabled = false; return }
    $banner.style.display = 'none'
    $state.textContent = `课堂进行中：${wanted}`
    setBusy(true, '正在准备本课并核对内容')
    startSse()
  })
  $banner.appendChild(document.createElement('br'))
  $banner.appendChild(btn)
  $banner.style.display = 'block'
}

// 页面加载：按课程找自己的课堂流程，决定附着、提示切换或起新课。
const wanted = new URLSearchParams(location.search).get('course')
findLessonFlow().then(async (found) => {
  if (found === undefined) return
  if (found.flow) {
    if (!flowClient.attach(found.flow)) return
    $state.textContent = `课堂进行中：${found.flow.courseId}`
    startSse()
    return
  }
  if (found.busy) {
    renderCourseMismatch(found.busy, wanted || found.busy.courseId)
    return
  }
  if (wanted) {
    const result = await api('/flow/start', { kind: 'learn', courseId: wanted })
    if (result.ok) {
      $state.textContent = `课堂进行中：${wanted}`
      $banner.style.display = 'none'
      setBusy(true, '正在准备本课并核对内容')
    } else {
      $banner.textContent = result.error
      $banner.style.display = 'block'
    }
    startSse()
    return
  }
  $banner.textContent = '当前没有进行中的课堂——去课程列表点「上课」开始。'
  $banner.style.display = 'block'
  startSse()
})
</script>
</body>
</html>
