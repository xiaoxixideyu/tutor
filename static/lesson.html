<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor 导师 · 课堂</title>
<link rel="stylesheet" href="/ui/chat.css">
</head>
<body>
<header>
  <a href="/" class="backlink">← 课程列表</a>
  <h1>课堂</h1>
  <span class="state" id="state">未连接</span>
  <a href="/app.html" class="backlink">工作区</a>
  <a href="/settings.html" class="backlink" target="_blank" rel="noopener">模型设置</a>
</header>
<div id="lesson-root" style="height: calc(100vh - 49px)"></div>
<script src="/md.js"></script>
<script src="/flow-client.js"></script>
<script src="/ui/dom.js"></script>
<script src="/ui/chat.js"></script>
<script src="/ui/views/learn.js"></script>
<script>
// 独立页面与单壳共用同一个课堂视图控制器（static/ui/views/learn.js）。
TutorViews.learn({
  root: document.getElementById('lesson-root'),
  courseId: new URLSearchParams(location.search).get('course'),
  onStatus: ({ text }) => { document.getElementById('state').textContent = text },
  onExit: ({ kind }) => { if (kind === 'list') location.href = '/' },
})
</script>
</body>
</html>
