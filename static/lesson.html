<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor 导师 · 课堂</title>
<link rel="stylesheet" href="/ui/chat.css">
</head>
<body>
<header>
  <a href="/" class="backlink">← 课程列表</a>
  <h1>课堂</h1>
  <span class="state" id="state">未连接</span>
  <span class="busy" id="busy" style="display:none"><span class="dot"></span><span id="busyText">等待模型回复…</span></span>
  <a href="/settings.html" class="backlink" target="_blank" rel="noopener">模型设置</a>
  <button id="stopBtn" class="danger">暂停本课</button>
</header>
<div class="banner" id="banner"></div>
<main id="log"></main>
<footer>
  <div class="quick">
    <button data-cmd="看不懂，换个讲法">换个讲法</button>
    <button data-cmd="给个提示">提示</button>
    <button data-cmd="/quiz">单元小测 /quiz</button>
    <button data-cmd="/check">内容核对 /check</button>
  </div>
  <div class="opstatus" id="opstatus"></div>
  <div class="inputrow" style="margin-top:8px">
    <input id="input" placeholder="输入你的回答…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </div>
</footer>
<script src="/md.js"></script>
<script src="/flow-client.js"></script>
<script src="/ui/dom.js"></script>
<script src="/ui/chat.js"></script>
<script>
const flowClient = new TutorFlowClient((message) => {
  chat.setBusy(false)
  $log.appendChild(TutorDom.el(`<div class="errline">${TutorDom.esc(message)}</div>`))
})
const $log = document.getElementById('log')
const $input = document.getElementById('input')
const $state = document.getElementById('state')
const $banner = document.getElementById('banner')
let activeCourse = null

const chat = new TutorChat({
  log: $log,
  input: $input,
  sendButton: document.getElementById('send'),
  stopButton: document.getElementById('stopBtn'),
  quickButtons: [...document.querySelectorAll('.quick button')],
  busyEl: document.getElementById('busy'),
  busyText: document.getElementById('busyText'),
  opStatus: document.getElementById('opstatus'),
  readyPlaceholder: '轮到你了，输入回答…（Enter 发送）',
  flowFinished: true,
  onSend: (line) => api('/flow/input', { line }),
})

// 上课以 code 0 退出（讲完一节或主动暂停）后的续接：给「继续上课 / 返回课程列表」两个入口，
// 而不是显示死板的「已结束」。继续＝对同一门课重新起 learn，runner 会从 plan.current 续到下一节
// （若是暂停则续回本节草稿）。
function renderLearnContinue(failed = false) {
  const courseId = activeCourse || new URLSearchParams(location.search).get('course')
  const row = TutorDom.el('<div class="chips"></div>')
  const back = TutorDom.el('<button class="chip">← 课程列表</button>')
  back.addEventListener('click', () => { location.href = '/' })
  if (courseId) {
    const cont = TutorDom.el(`<button class="chip">${failed ? '从已保存进度重试 →' : '继续上课 →'}</button>`)
    cont.addEventListener('click', async () => {
      if (chat.busy) return
      row.remove()
      chat.setBusy(true, '正在准备本课并核对内容')
      const result = await api('/flow/start', { kind: 'learn', courseId })
      if (!result.ok) {
        chat.setBusy(false)
        $log.appendChild(TutorDom.el(`<div class="errline">${TutorDom.esc(result.error || '继续失败')}</div>`))
        return
      }
      $state.textContent = `课堂进行中：${courseId}`
    })
    row.appendChild(cont)
  }
  row.appendChild(back)
  $log.appendChild(row)
  chat.scrollToEnd()
}

async function startSse() {
  const es = flowClient.connect()
  if (!es) return
  es.onmessage = (event) => {
    const msg = JSON.parse(event.data)
    if (msg.type === 'hello' && msg.replay === undefined) {
      // hello 后紧接重放历史：清空当前视图避免重复
      $log.innerHTML = ''
      chat.reset()
      activeCourse = msg.courseId
      chat.setFlowFinished(msg.status !== 'running' && msg.status !== 'stopping')
      chat.setBusy(!chat.flowFinished, '正在恢复课堂')
      $state.textContent = msg.courseId ? `课堂进行中：${msg.courseId}` : '空闲'
      if (!msg.courseId) $banner.style.display = 'block'
      return
    }
    if (msg.type === 'out') chat.feed(msg.text)
    else if (msg.type === 'err') { if (chat.isOpError(msg.text)) chat.noteOp(msg.text); else $log.appendChild(TutorDom.el(`<div class="errline">${TutorDom.esc(msg.text)}</div>`)) }
    else if (msg.type === 'exit') {
      chat.feed('')
      const closed = chat.closeBubble()
      if (closed) chat.maybeChips(closed)
      chat.setFlowFinished(true)
      chat.clearOp()
      chat.setBusy(false)
      if (msg.kind === 'learn' && msg.code === 0) {
        // learn 每讲完一节 / 暂停都以 0 退出——给「继续上课 / 返回」入口，别让用户以为课程结束了
        $state.textContent = '本节告一段落'
        renderLearnContinue()
      } else {
        $state.textContent = '已结束'
        $log.appendChild(TutorDom.el(`<div class="sysline">—— 课堂进程退出（code ${msg.code}）——</div>`))
        if (msg.kind === 'learn') renderLearnContinue(true)
      }
    }
    chat.scrollToEnd()
  }
  es.onerror = () => {
    $state.textContent = '连接中断，重连中…'
    chat.setBusy(false)
  }
}

async function api(path, body) {
  const result = await flowClient.request(path, body)
  if (path === '/flow/start' && result.ok) { chat.setFlowFinished(false); startSse() }
  return result
}

async function findLessonFlow() {
  const state = await flowClient.state()
  if (!state) return undefined
  const flows = state.flows ?? []
  const learnFlows = flows.filter((flow) => flow.kind === 'learn')
  const mine = wanted ? learnFlows.find((flow) => flow.courseId === wanted) : learnFlows[0]
  if (mine) return { flow: mine, busy: null }
  // 同一门课被别的流程占用（同课程互斥）；其他课程的流程与本页无关，可并行运行。
  const busy = wanted ? flows.find((flow) => flow.courseId === wanted) : null
  return { flow: null, busy: busy ?? null }
}

function send() {
  if (chat.busy || chat.flowFinished) return
  const line = $input.value.trim()
  if (!line) return
  $input.value = ''
  chat.sendLine(line)
}

document.getElementById('send').addEventListener('click', send)
$input.addEventListener('keydown', (event) => {
  // isComposing 守卫：中文输入法回车选字时不误发半成品
  if (event.key === 'Enter' && !event.isComposing) send()
})
for (const button of document.querySelectorAll('.quick button')) {
  button.addEventListener('click', () => {
    if (chat.busy || chat.flowFinished) return
    chat.sendLine(button.dataset.cmd)
  })
}
document.getElementById('stopBtn').addEventListener('click', async () => {
  await api('/flow/stop')
})

// 同一门课程同时只能运行一个流程；不同课程的流程可以并行，不进本页的切换提示。
function renderCourseMismatch(runningFlow, wanted) {
  if (!flowClient.attach(runningFlow)) return
  const running = runningFlow.courseId
  const kind = { new: '需求访谈', assess: '摸底测评', plan: '教学规划', research: '教研',
    learn: '课堂', exam: '里程碑大考', 'practice-gen': '实践任务生成', practice: '实践' }[runningFlow.kind] || '教学流程'
  $state.textContent = `${kind}进行中：${running}`
  $banner.innerHTML = ''
  $banner.appendChild(document.createTextNode(
    `「${running}」正在进行${kind}。同一门课程同时只能运行一个流程；开始本课课堂前，需要先结束它。`))
  const btn = TutorDom.el(`<button style="margin-top:8px;cursor:pointer">结束当前流程并开始「${TutorDom.esc(wanted)}」课堂</button>`)
  btn.addEventListener('click', async () => {
    btn.disabled = true
    btn.textContent = `正在结束${kind}…`
    const stopped = await api('/flow/stop')
    if (!stopped.ok) { btn.disabled = false; btn.textContent = '重试切换'; return }
    // 等旧流程真正结束（该课程的槽位释放）再起新课，否则会撞「已有进行中的流程」
    for (let i = 0; i < 40; i++) {
      const s = await flowClient.state()
      if (!s) { btn.disabled = false; return }
      if (!(s.flows ?? []).some((flow) => flow.courseId === running)) break
      await new Promise((r) => setTimeout(r, 500))
    }
    const result = await api('/flow/start', { kind: 'learn', courseId: wanted })
    if (!result.ok) { $banner.textContent = result.error || '切换失败'; btn.disabled = false; return }
    $banner.style.display = 'none'
    $state.textContent = `课堂进行中：${wanted}`
    chat.setBusy(true, '正在准备本课并核对内容')
    startSse()
  })
  $banner.appendChild(document.createElement('br'))
  $banner.appendChild(btn)
  $banner.style.display = 'block'
}

// 页面加载：按课程找自己的课堂流程，决定附着、提示切换或起新课。
const wanted = new URLSearchParams(location.search).get('course')
findLessonFlow().then(async (found) => {
  if (found === undefined) return
  if (found.flow) {
    if (!flowClient.attach(found.flow)) return
    $state.textContent = `课堂进行中：${found.flow.courseId}`
    startSse()
    return
  }
  if (found.busy) {
    renderCourseMismatch(found.busy, wanted || found.busy.courseId)
    return
  }
  if (wanted) {
    const result = await api('/flow/start', { kind: 'learn', courseId: wanted })
    if (result.ok) {
      $state.textContent = `课堂进行中：${wanted}`
      $banner.style.display = 'none'
      chat.setBusy(true, '正在准备本课并核对内容')
    } else {
      $banner.textContent = result.error
      $banner.style.display = 'block'
    }
    startSse()
    return
  }
  $banner.textContent = '当前没有进行中的课堂——去课程列表点「上课」开始。'
  $banner.style.display = 'block'
  startSse()
})
</script>
</body>
</html>
