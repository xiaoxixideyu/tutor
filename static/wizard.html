<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor 导师 · 新课程向导</title>
<link rel="stylesheet" href="/research-progress.css">
<style>
  :root {
    --fg: #1a1d21; --muted: #6b7280; --bg: #f6f7f9; --card: #fff; --border: #e4e7ec;
    --accent: #2563eb; --red: #dc2626; --green: #16a34a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { margin: 0; font-size: 16px; flex: 1; }
  .state { font-size: 12px; color: var(--muted); }
  button { font-family: inherit; }
  .danger { color: var(--red); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
  .danger:hover { background: var(--bg); }
  header a.backlink { text-decoration: none; color: var(--muted); font-size: 13px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; }
  header a.backlink:hover { background: var(--bg); }
  .busy { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 13px; }
  .busy .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; margin: 0 auto; width: 100%; }
  .tutor { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; line-height: 1.65; font-size: 14px; }
  .tutor h1, .tutor h2, .tutor h3 { font-size: 14px; margin: 12px 0 6px; }
  .tutor pre { background: #0d1117; color: #e6edf3; border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; margin: 8px 0; white-space: pre; }
  .tutor code { background: #eef1f5; border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .tutor pre code { background: none; padding: 0; }
  .tutor ul, .tutor ol { margin: 6px 0; padding-left: 22px; }
  .tutor p { margin: 6px 0; }
  .tutor strong { font-weight: 600; }
  .userline { text-align: right; color: var(--muted); font-size: 13px; margin: 8px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
  .chip { background: var(--card); border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; user-select: none; }
  .chip:hover { background: #eef2ff; }
  .chip.selected { background: var(--accent); color: #fff; }
  .chip.disabled { opacity: .55; cursor: default; }
  .chips .hint { font-size: 12px; color: var(--muted); align-self: center; }
  .sysline { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .opstatus { display: none; max-width: 820px; margin: 8px auto 0; width: 100%; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  .errline { color: var(--red); font-size: 13px; white-space: pre-wrap; }
  .cost { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .cost .c-g { color: var(--green); } .cost .c-y { color: #d97706; } .cost .c-r { color: var(--red); }
  footer { border-top: 1px solid var(--border); background: var(--card); padding: 12px 20px; }
  .inputrow { display: flex; gap: 8px; max-width: 860px; margin: 0 auto; width: 100%; }
  .inputrow input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: inherit; }
  .inputrow button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 14px; }
  .setup { max-width: 460px; margin: 10vh auto 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
  .setup h2 { margin: 0 0 6px; font-size: 17px; }
  .setup p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .setup label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .setup input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  .setup .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  .setup button.primary { width: 100%; margin-top: 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px; cursor: pointer; font-size: 15px; }
  .steps { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .steps .step { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); }
  .steps .step.active { background: #dbeafe; color: var(--accent); border-color: var(--accent); }
  .steps .step.done { background: #dcfce7; color: var(--green); border-color: transparent; }
  .steps .goto { margin-left: auto; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  .costchip { font-size: 12px; color: var(--muted); background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
  .milestone { color: var(--muted); font-size: 13px; padding: 2px 0; }
  .milestone.warn { color: #b45309; }
  #researchLive progress { height: 12px; }
</style>
</head>
<body>
<header>
  <a href="/" class="backlink">← 课程列表</a>
  <h1 id="title">新课程向导</h1>
  <span class="busy" id="busy" style="display:none"><span class="dot"></span><span id="busyText">等待模型回复… 0s</span></span>
  <span class="costchip" id="costChip" hidden></span>
  <span class="state" id="state"></span>
  <a href="/settings.html" class="backlink" target="_blank" rel="noopener">模型设置</a>
  <button class="danger" id="stopBtn">中止流程</button>
</header>
<div class="steps" id="steps" style="display:none">
  <span class="step" data-step="new">1 访谈建档</span> →
  <span class="step" data-step="research">联网教研（可选）</span> →
  <span class="step" data-step="assess">摸底测评</span> →
  <span class="step" data-step="plan">教学计划</span> →
  <span class="step" data-step="learn">上课</span>
  <button class="goto" id="gotoBtn" style="display:none">进入课堂 →</button>
  <button class="goto" id="researchBtn" style="display:none">先联网教研（约 ¥1，官方来源）</button>
</div>
<section id="researchLive" hidden></section>
<main id="log"></main>
<div class="setup" id="setup">
  <h2>开设新课程</h2>
  <p>导师会先做需求访谈（几个问题），随后引导摸底与计划，全部在这里完成。</p>
  <label>课程标识（小写英文/数字/连字符，如 python、english-writing）</label>
  <input id="courseId" placeholder="python" autocomplete="off">
  <div class="err" id="err"></div>
  <button class="primary" id="startBtn">开始访谈</button>
</div>
<footer id="footer" style="display:none">
  <div class="opstatus" id="opstatus"></div>
  <div class="inputrow">
    <input id="input" placeholder="输入你的回答…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </div>
</footer>
<script src="/md.js"></script>
<script src="/flow-client.js"></script>
<script src="/research-progress.js"></script>
<script src="/ui/dom.js"></script>
<script>
const researchLive = new TutorResearchProgress(document.getElementById('researchLive'))
const flowClient = new TutorFlowClient((message) => {
  setBusy(false)
  $log.appendChild(TutorDom.el(`<div class="errline">${TutorDom.esc(message)}</div>`))
})
const $log = document.getElementById('log')
const $input = document.getElementById('input')
const $state = document.getElementById('state')
const $setup = document.getElementById('setup')
const $footer = document.getElementById('footer')
const $steps = document.getElementById('steps')
const $title = document.getElementById('title')
let chips = null
let chipMulti = false
let chipSelection = []
let chipsAnswered = false
let currentKind = null
let courseName = null
let currentNodeId = ''
let busy = false
let busyTimer = null
let busySeconds = 0

// 只在已贴近底部时才自动滚动——用户上翻回看时不被拽到底
function scrollToEnd() {
  if ($log.scrollHeight - $log.scrollTop - $log.clientHeight < 120) $log.scrollTop = $log.scrollHeight
}

function setBusy(on, label) {
  busy = on
  const $busy = document.getElementById('busy')
  const $send = document.getElementById('send')
  if (busyTimer) { clearInterval(busyTimer); busyTimer = null }
  $input.disabled = on
  if ($send) $send.disabled = on
  if (on) {
    busySeconds = 0
    document.getElementById('busyText').textContent = `${label ?? '等待模型回复'}… 0s`
    $busy.style.display = 'inline-flex'
    busyTimer = setInterval(() => {
      busySeconds++
      document.getElementById('busyText').textContent = `${label ?? '等待模型回复'}… ${busySeconds}s`
    }, 1000)
  } else {
    $busy.style.display = 'none'
    $input.placeholder = '轮到你了，输入回答…（Enter 发送）'
    if ($footer.style.display !== 'none') $input.focus()
  }
}

const COST_RE = /^(本回合|会话累计|审查开销)/
// 只有真正需要用户处理的才算"错误"；限流等待、内部核查、成本等一律进安静状态条，避免刷屏。
const FAILURE_RE = /(不存在|未完成|失败|无法|不支持|非法|中断|预算|未通过|拦截|缺少|请先)/
// 引擎内部运行提示（限流等待、生成与审查进度等）——不进对话流，只在状态条/进度面板里显示。
const OP_OUT_RE = /^(?:tutor:\s*)?(等待渠道额度|渠道暂时|渠道临时错误后的重试等待|重新检查共享额度|按共享队列.*排队|约 \d+ 秒后|正在备课[：:]|备课完成|正在从可用的已审查内容恢复课堂|复用同一内容的|正在核对.*范围与正确性|[^\n]{0,12}核查中[：:]|资料审查达到|正在构思知识地图骨架|正在生成知识地图|知识地图就绪|正在生成摸底题库[：:]|正在设计|正在生成试卷|正在生成并核对|正在汇总本知识点|正在核对本知识点|检索资料（|读取来源正文（|第 \d+\/\d+ 个知识点教研中)/
function cleanOp(text) {
  return String(text ?? '').replace(/^tutor:\s*/, '').replace(/\s*；已保存的教研进度保留。?\s*$/, '').trim()
}
function noteOp(text) {
  const t = cleanOp(text)
  if (!t) return
  const $op = document.getElementById('opstatus')
  $op.textContent = '⏳ ' + t
  $op.style.display = 'block'
}
function clearOp() {
  const $op = document.getElementById('opstatus')
  $op.textContent = ''
  $op.style.display = 'none'
}

// 成本只进顶部累计徽章；不再逐条刷进对话流。
let flowCost = 0
let flowCostCalls = 0
let flowSessionTotal = null
function noteCostLine(line) {
  const amounts = [...String(line).matchAll(/¥\s*([0-9]+(?:\.[0-9]+)?)/g)].map(match => Number(match[1]))
  if (/会话累计/.test(line)) { if (amounts.length > 0) flowSessionTotal = Math.max(flowSessionTotal ?? 0, amounts[0]) }
  else for (const amount of amounts) { flowCost += amount; if (amount > 0) flowCostCalls += 1 }
  const total = Math.max(flowCost, flowSessionTotal ?? 0)
  const chip = document.getElementById('costChip')
  chip.hidden = total < 0.0005
  if (!chip.hidden) chip.textContent = `已用 ≈ ¥${total.toFixed(2)}${flowCostCalls > 0 ? ` · 审查 ${flowCostCalls} 项` : ''}`
}
function resetCost() {
  flowCost = 0; flowCostCalls = 0; flowSessionTotal = null
  const chip = document.getElementById('costChip')
  chip.hidden = true; chip.textContent = ''
}

// 引擎文本分流：返回 true 表示已归入状态条/里程碑/成本徽章，不再进对话流。
function routeEngineLine(text) {
  const trimmed = String(text ?? '').trim()
  if (trimmed.startsWith('@@tutor-progress ')) return true
  if (COST_RE.test(trimmed)) { noteCostLine(trimmed); return true }
  if (/^内容审查[^：]*：/.test(trimmed)) {
    if (/拦截|未完成/.test(trimmed)) {
      closeBubble()
      $log.appendChild(TutorDom.el(`<div class="milestone warn">⚠ ${TutorDom.esc(cleanOp(trimmed))}</div>`))
      scrollToEnd()
    } else noteOp(trimmed)
    return true
  }
  if (/已保存：来源|本次教研已保存/.test(trimmed)) {
    closeBubble()
    $log.appendChild(TutorDom.el(`<div class="milestone">✓ ${TutorDom.esc(cleanOp(trimmed))}</div>`))
    scrollToEnd()
    return true
  }
  if (OP_OUT_RE.test(trimmed)) { noteOp(trimmed); return true }
  if (/^tutor:/.test(trimmed) && !FAILURE_RE.test(trimmed)) { noteOp(trimmed); return true }
  return false
}
let pending = ''
let bubble = null
let bubbleText = ''

// 共享实现见 static/md.js（课堂/考试/复习/向导四页共用同一渲染器）
const mdToHtml = window.TutorMd.toHtml


function renderBubble() {
  if (!bubble || !bubbleText) return
  bubble.innerHTML = mdToHtml(bubbleText)
}


function handleLine(line) {
  const trimmed = line.trim()
  if (trimmed === '>') {
    const closed = closeBubble()
    if (closed) maybeChips(closed)
    clearOp()
    setBusy(false)
    return
  }
  if (routeEngineLine(line)) return
  if (trimmed === '') return
  if (!bubble) { clearOp(); bubble = TutorDom.el('<div class="tutor"></div>'); $log.appendChild(bubble) }
  bubbleText += (bubbleText ? '\n' : '') + line
  bubble.textContent = bubbleText
  scrollToEnd()
}

function feed(text) {
  pending += text
  let idx
  while ((idx = pending.indexOf('\n')) >= 0) {
    const line = pending.slice(0, idx)
    pending = pending.slice(idx + 1)
    handleLine(line)
  }
  if (pending.trim() === '>') { handleLine('>'); pending = '' }
}

function optionLinesOf(text) {
  const out = []
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*([A-Fa-f])[.、．]\s*(\S.*)$/)
    if (m) out.push({ letter: m[1].toUpperCase(), label: m[2].trim() })
  }
  return out
}

function maybeChips(text) {
  const options = optionLinesOf(text)
  if (options.length < 2 || options.length > 6) return
  // 单个问题（一组连续字母）
  const letters = options.map((o) => o.letter)
  const expects = ['A', 'B', 'C', 'D', 'E', 'F'].slice(0, letters.length)
  if (letters.join('') !== expects.join('')) return
  // 旧 chips 未答复则作废
  const multi = /可多选|可多選|多选题|（多选）|\(多选\)/.test(text)
  const container = TutorDom.el('<div class="chips"></div>')
  chipMulti = multi
  chipSelection = []
  chipsAnswered = false
  if (multi) container.appendChild(TutorDom.el('<span class="hint">可多选，选完点「提交选择」</span>'))
  for (const opt of options) {
    const chip = TutorDom.el(`<button class="chip">${TutorDom.esc(opt.letter)}. ${TutorDom.esc(opt.label)}</button>`)
    chip.addEventListener('click', () => {
      if (chipsAnswered) return
      if (multi) {
        const idx = chipSelection.indexOf(opt.letter)
        if (idx >= 0) chipSelection.splice(idx, 1)
        else chipSelection.push(opt.letter)
        chip.classList.toggle('selected')
      } else {
        chipsAnswered = true
        for (const c of container.querySelectorAll('.chip')) c.classList.add('disabled')
        chip.classList.add('selected')
        submitChips([opt.letter])
      }
    })
    container.appendChild(chip)
  }
  if (multi) {
    const submit = TutorDom.el('<button class="chip">提交选择</button>')
    submit.addEventListener('click', () => {
      if (chipsAnswered || chipSelection.length === 0) return
      chipsAnswered = true
      for (const c of container.querySelectorAll('.chip')) c.classList.add('disabled')
      submitChips(chipSelection)
    })
    container.appendChild(submit)
  }
  $log.appendChild(container)
  $log.scrollTop = $log.scrollHeight
}

function submitChips(letters) {
  const line = letters.join('')
  $log.appendChild(TutorDom.el(`<div class="userline">你：${TutorDom.esc(line)}</div>`))
  closeBubble()
  setBusy(true)
  api('/flow/input', { line })
}

// 教研决策：把「先联网教研」和「跳过」并排放进对话流。顶栏那个 researchBtn 太靠边，
// 用户容易只看到下方的「跳过」chip、以为没有进入教研的入口（实测反馈）。
function researchDecision(skipKind, skipLabel) {
  const row = TutorDom.el('<div class="chips"></div>')
  const go = TutorDom.el('<button class="chip">先联网教研（约 ¥1，官方来源）</button>')
  const skip = TutorDom.el(`<button class="chip">${TutorDom.esc(skipLabel)}</button>`)
  const done = (next) => { row.remove(); document.getElementById('researchBtn').style.display = 'none'; startFlow(next) }
  go.addEventListener('click', () => done('research'))
  skip.addEventListener('click', () => done(skipKind))
  row.appendChild(go)
  row.appendChild(skip)
  $log.appendChild(row)
  scrollToEnd()
}

// 单步确认 chip：两个模型步骤之间放一个「下一步 →」按钮，避免自动触发一次模型调用（会花钱），
// 也给用户一个明确的推进入口。用于摸底完成→生成计划这类只有唯一后继的环节。
function nextStepChip(kind, label, nodeId = '') {
  const row = TutorDom.el('<div class="chips"></div>')
  const go = TutorDom.el(`<button class="chip">${TutorDom.esc(label)}</button>`)
  go.addEventListener('click', () => { row.remove(); startFlow(kind, nodeId) })
  row.appendChild(go)
  $log.appendChild(row)
  scrollToEnd()
}

function closeBubble() {
  if (bubble) renderBubble()
  const text = bubbleText
  bubble = null
  bubbleText = ''
  return text
}

function markStep(kind, state) {
  for (const el of $steps.querySelectorAll('.step')) {
    if (el.dataset.step === kind) {
      el.classList.toggle('active', state === 'active')
      el.classList.toggle('done', state === 'done')
    }
  }
}

function resetSteps() {
  for (const el of $steps.querySelectorAll('.step')) el.classList.remove('active', 'done')
}

const STEP_TITLES = { new: '需求访谈', assess: '摸底测评', plan: '教学计划', research: '联网教研', learn: '课堂', 'audit-content': '内容审查' }

async function startSse() {
  const es = flowClient.connect()
  if (!es) return
  es.onmessage = (event) => {
    const msg = JSON.parse(event.data)
    if (msg.type === 'hello' && msg.replay === undefined) {
      // hello 后紧接重放历史：清空当前视图避免重复
      $log.innerHTML = ''
      pending = ''
      bubble = null
      bubbleText = ''
    }
    if (msg.type === 'hello') {
      currentNodeId = msg.nodeId || ''
      if (msg.kind && msg.kind !== currentKind) {
        // 已有别的流程在跑
        currentKind = msg.kind
        courseName = msg.courseId
        showConsole()
      }
      return
    }
    if (msg.type === 'out') feed(msg.text)
    else if (msg.type === 'err') { if (!routeEngineLine(msg.text)) $log.appendChild(TutorDom.el(`<div class="errline">${TutorDom.esc(msg.text)}</div>`)) }
    else if (msg.type === 'exit') {
      feed('')
      renderBubble()
      closeBubble()
      setBusy(false)
      clearOp()
      $footer.style.display = 'none'
      document.getElementById('stopBtn').disabled = true
      if (msg.kind === 'new' && msg.code === 0) {
        markStep('new', 'done')
        $log.appendChild(TutorDom.el('<div class="sysline">—— 访谈完成。可先联网教研（官方来源、讲授可溯源），或直接进入摸底 ——</div>'))
        researchDecision('assess', '跳过教研，直接摸底 →')
      } else if (msg.kind === 'assess' && msg.code === 0) {
        markStep('assess', 'done')
        $log.appendChild(TutorDom.el('<div class="sysline">—— 摸底完成 ——</div>'))
        document.getElementById('gotoBtn').style.display = 'none'
        nextStepChip('plan', '生成教学计划 →')
      } else if (msg.kind === 'research' && msg.code === 0) {
        if (!currentNodeId) markStep('research', 'done')
        document.getElementById('researchBtn').style.display = 'none'
        $log.appendChild(TutorDom.el('<div class="sysline">—— 本次教研已保存，可继续剩余教研或进入摸底 ——</div>'))
        nextStepChip('research', '继续未完成的教研 →')
        $log.appendChild(TutorDom.el(`<div class="sysline"><a href="/?course=${encodeURIComponent(courseName)}">查看各知识点的资料与验证进度</a></div>`))
        nextStepChip('assess', '开始摸底 →')
      } else if (msg.kind === 'plan' && msg.code === 0) {
        markStep('plan', 'done')
        $log.appendChild(TutorDom.el('<div class="sysline">—— 计划就绪，准备上课 ——</div>'))
        document.getElementById('gotoBtn').style.display = 'inline-block'
      } else if (msg.kind === 'audit-content') {
        // 内容重审：结束即可回课程详情查看结果；code 0=全部通过，2=仍有条目被拒。
        const ok = msg.code === 0
        $log.appendChild(TutorDom.el(`<div class="sysline">—— 内容重新审查${ok ? '全部通过' : '完成，仍有未通过条目'}（code ${msg.code}）——</div>`))
        if (ok) {
          markStep('new', 'done'); markStep('plan', 'done')
          $log.appendChild(TutorDom.el('<div class="sysline">内容已通过当前审查，可以开始上课。</div>'))
          nextStepChip('learn', '去上课 →')
        } else {
          $log.appendChild(TutorDom.el(`<div class="sysline"><a href="/?course=${encodeURIComponent(courseName)}">查看未通过的具体问题</a></div>`))
          nextStepChip('audit-content', '重新审查 →')
        }
      } else {
        $log.appendChild(TutorDom.el(`<div class="sysline">—— ${STEP_TITLES[msg.kind] ?? msg.kind} 结束（code ${msg.code}）——</div>`))
        if (msg.code !== 0) {
          nextStepChip(msg.kind, currentNodeId ? '重试本知识点 →' : '从已保存进度重试 →', currentNodeId)
          if (msg.kind === 'research' && currentNodeId) nextStepChip('research', '继续未完成的教研 →')
        }
      }
      scrollToEnd()
    }
  }
  es.onerror = () => { setBusy(false); $state.textContent = '连接中断，正在重连…' }
}

async function api(path, body) {
  const result = await flowClient.request(path, body)
  if (path === '/flow/start' && result.ok) { rememberFlow(result); startSse() }
  return result
}

function rememberFlow(flow) {
  resetCost()
  currentNodeId = flow.nodeId || ''
  const url = new URL(location.href)
  url.searchParams.set('course', flow.courseId)
  url.searchParams.set('resume', flow.kind)
  url.searchParams.set('flowId', flow.flowId)
  if (currentNodeId) url.searchParams.set('node', currentNodeId)
  else url.searchParams.delete('node')
  history.replaceState(null, '', url)
}

function busyLabel(kind) {
  return kind === 'assess' ? '准备并核对摸底题目' : kind === 'plan' ? '设计并核对学习计划' : kind === 'research' ? '联网教研进行中'
    : kind === 'audit-content' ? '正在重新审查课程内容' : '等待模型回复'
}

async function startFlow(kind, nodeId = '') {
  currentKind = kind
  currentNodeId = kind === 'research' ? nodeId : ''
  markStep(kind, 'active')
  $title.textContent = `${STEP_TITLES[kind] ?? kind} · ${courseName}`
  $footer.style.display = 'block'
  $setup.style.display = 'none'
  document.getElementById('stopBtn').disabled = false
  setBusy(true, busyLabel(kind))
  await api('/flow/start', { kind, courseId: courseName, ...(currentNodeId ? { nodeId: currentNodeId } : {}) })
}

function showConsole() {
  researchLive.connect(currentKind === 'research' ? courseName : null)
  $setup.style.display = 'none'
  $steps.style.display = 'flex'
  $footer.style.display = 'block'
  $title.textContent = `${STEP_TITLES[currentKind] ?? currentKind} · ${courseName}`
}

function send() {
  if (busy) return
  const line = $input.value.trim()
  if (!line) return
  $input.value = ''
  $log.appendChild(TutorDom.el(`<div class="userline">你：${TutorDom.esc(line)}</div>`))
  closeBubble()
  setBusy(true)
  // /flow/input 在没有活动流程时返回 409 {ok:false}；此前忽略响应会让「模型思考中」计时器空转不止。
  api('/flow/input', { line })
    .then((r) => {
      if (r && r.ok === false) {
        setBusy(false)
        $log.appendChild(TutorDom.el(`<div class="errline">${TutorDom.esc(r.error ?? '当前没有进行中的流程——请用上方按钮选择「先联网教研」或「跳过」')}</div>`))
        scrollToEnd()
      }
    })
    .catch(() => { setBusy(false); $log.appendChild(TutorDom.el('<div class="errline">发送失败，请重试</div>')) })
}

document.getElementById('send').addEventListener('click', send)
// isComposing 守卫：中文输入法回车选字时不误发半成品
$input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) send() })
document.getElementById('stopBtn').addEventListener('click', () => api('/flow/stop'))
document.getElementById('startBtn').addEventListener('click', async () => {
  const id = document.getElementById('courseId').value.trim()
  document.getElementById('err').textContent = ''
  if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(id)) {
    document.getElementById('err').textContent = '课程标识需为小写英文/数字/连字符'
    return
  }
  const state = await flowClient.state()
  if (!state) return
  const sameCourse = (state.flows ?? []).find((flow) => flow.courseId === id)
  if (sameCourse) {
    document.getElementById('err').textContent = `课程「${id}」已有进行中的流程（${sameCourse.kind}）`
    return
  }
  courseName = id
  $steps.style.display = 'flex'
  resetSteps()
  startFlow('new')
})
document.getElementById('gotoBtn').addEventListener('click', () => {
  location.href = `/lesson.html?course=${encodeURIComponent(courseName)}`
})
document.getElementById('researchBtn').addEventListener('click', () => startFlow('research'))

// 从课程列表「生成计划 / 去摸底」跳进来时的续起：?course=<id>&resume=<kind>，跳过 setup 面板、
// 直接从该步起流程（复用 startFlow），并把该步之前的阶段标为已完成。仅接受向导内的步骤，learn 归课堂页。
function resumeFrom(kind, course, nodeId) {
  courseName = course
  $setup.style.display = 'none'
  $steps.style.display = 'flex'
  resetSteps()
  const steps = [...$steps.querySelectorAll('.step')].map((s) => s.dataset.step)
  const target = steps.indexOf(kind)
  for (let i = 0; i < target; i++) {
    if (steps[i] === 'research') continue // 教研可选，不预标完成
    markStep(steps[i], 'done')
  }
  startFlow(kind, nodeId)
}

// 页面加载：附加本课程的进行中流程（刷新不丢；其他课程的并行流程与本页无关）；
// 否则若带 ?course=&resume= 则续起；再否则停在 setup
const entryParams = new URLSearchParams(location.search)
const WIZARD_KINDS = ['new', 'assess', 'plan', 'research', 'audit-content']
flowClient.state(entryParams.get('flowId')).then((state) => {
  if (!state) return
  const requestedCourse = entryParams.get('course')
  const available = state.flow ?? (state.flows ?? []).find((flow) =>
    WIZARD_KINDS.includes(flow.kind) && (!requestedCourse || flow.courseId === requestedCourse))
  if (available) {
    if (!WIZARD_KINDS.includes(available.kind)
      || (requestedCourse && available.courseId !== requestedCourse)) {
      document.getElementById('err').textContent = `当前流程属于 ${available.kind} ${available.courseId}，请先返回课程列表。`
      return
    }
    if (!flowClient.attach(available)) return
    rememberFlow(available)
    currentKind = available.kind
    courseName = available.courseId
    showConsole()
    markStep(currentKind, 'active')
    setBusy(available.status === 'running', busyLabel(currentKind))
    startSse()
    return
  }
  const course = entryParams.get('course')
  const resume = entryParams.get('resume')
  const nodeId = resume === 'research' ? entryParams.get('node') || '' : ''
  if (nodeId && !/^[a-z0-9][a-z0-9-]*$/.test(nodeId)) {
    document.getElementById('err').textContent = '知识点参数非法'
    return
  }
  if (course && /^[a-z0-9][a-z0-9-]{0,63}$/.test(course) && ['assess', 'plan', 'research', 'new', 'audit-content'].includes(resume)) {
    if (entryParams.has('flowId')) {
      currentKind = resume; courseName = course; showConsole()
      $footer.style.display = 'none'
      document.getElementById('stopBtn').disabled = true
      $log.appendChild(TutorDom.el('<div class="sysline">流程回放已过期。可从课程已保存的进度继续。</div>'))
      nextStepChip(resume, '从已保存进度继续 →', nodeId)
    } else resumeFrom(resume, course, nodeId)
  }
  startSse()
})
</script>
</body>
