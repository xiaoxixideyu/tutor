<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173c33" />
    <title>tutor · 你的学习导师</title>
    <link rel="stylesheet" href="/ui/app.css" />
  </head>
  <body>
    <aside class="rail" id="rail">
      <a href="#/" class="brand"
        ><span class="brand-mark">t</span><span>tutor<small>你的学习导师</small></span></a
      >
      <nav class="main-nav">
        <a href="#/" data-nav="today">今天</a><a href="#/courses" data-nav="courses">我的课程</a>
      </nav>
      <button id="new-course" class="new-course">＋ 开始一个学习目标</button>
      <div class="rail-caption">正在学习</div>
      <div id="course-nav" class="course-nav"></div>
      <div class="rail-bottom"><button id="open-settings">模型设置</button><span>目标 · 实践 · 真正学会</span></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <button id="toggle-rail" class="mobile-menu" aria-label="打开课程列表">☰</button>
        <div id="page-title">今天</div>
        <div class="topbar-right"><span id="connection-state"></span><button id="top-settings">设置</button></div>
      </header>
      <div id="app-canvas" class="canvas" aria-live="polite"></div>
    </main>
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="settings-drawer" class="drawer" hidden aria-label="模型设置">
      <div class="drawer-head">
        <h2>模型设置</h2>
        <button id="close-settings" aria-label="关闭设置">✕</button>
      </div>
      <div id="settings-body"></div>
    </aside>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="/md.js"></script>
    <script src="/ui/dom.js"></script>
    <script src="/ui/settings.js"></script>
    <script src="/ui/app.js"></script>
  </body>
</html>
