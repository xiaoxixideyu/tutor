<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor 导师 · 大考</title>
<link rel="stylesheet" href="/ui/chat.css">
</head>
<body>
<header>
  <a href="/" class="backlink">← 课程列表</a>
  <h1 id="title">里程碑大考</h1>
  <span class="busy" id="busy" style="display:none"><span class="dot"></span><span id="busyText">等待模型回复…</span></span>
  <a href="/settings.html" class="backlink" target="_blank" rel="noopener">模型设置</a>
  <span class="state" id="state">未连接</span>
  <button id="stopBtn" class="danger">暂停大考</button>
</header>
<div class="banner" id="banner"></div>
<main id="log"></main>
<footer>
  <div class="opstatus" id="opstatus"></div>
  <div class="inputrow">
    <input id="input" placeholder="输入你的答案…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </div>
</footer>
<script src="/md.js"></script>
<script src="/flow-client.js"></script>
<script src="/ui/dom.js"></script>
<script src="/ui/chat.js"></script>
<script>
const flowClient = new TutorFlowClient((message) => {
  chat.setBusy(false)
  $log.appendChild(TutorDom.el(`<div class="errline">${TutorDom.esc(message)}</div>`))
})
// 大考页：复用 lesson.html 的流式渲染 + chips + `>` 哨兵机制（exam-runner 已对齐每题读取前吐 `\n> `）。
// 与课堂的差别只在：启动走 {kind:'exam', courseId, milestoneId}、退出显示成绩收尾而非「继续下一节」。
const $log = document.getElementById('log')
const $input = document.getElementById('input')
const $state = document.getElementById('state')
const $banner = document.getElementById('banner')
const params = new URLSearchParams(location.search)
const wantedCourse = params.get('course')
const wantedMilestone = params.get('milestone') || ''
let activeCourse = null
let examOutcome = null

const chat = new TutorChat({
  log: $log,
  input: $input,
  sendButton: document.getElementById('send'),
  stopButton: document.getElementById('stopBtn'),
  busyEl: document.getElementById('busy'),
  busyText: document.getElementById('busyText'),
  opStatus: document.getElementById('opstatus'),
  readyPlaceholder: '轮到你了，输入答案…（Enter 发送）',
  flowFinished: false,
  onSend: (line) => api('/flow/input', { line }),
  onLine: (line) => {
    if (/^大考成绩：.*（通过）/.test(line)) examOutcome = 'passed'
    else if (/^大考成绩：.*（未过/.test(line)) examOutcome = 'failed'
    else if (line.startsWith('考试暂停')) examOutcome = 'paused'
  },
})

// 暂停也会正常退出，必须根据实际成绩区分通过与尚未完成。
function renderExamDone() {
  const row = TutorDom.el('<div class="chips"></div>')
  if (examOutcome !== 'passed' && examOutcome !== 'failed') {
    const resume = TutorDom.el('<button class="chip">继续考试</button>')
    resume.addEventListener('click', async () => {
      resume.disabled = true
      if (!await startExam(wantedCourse, wantedMilestone)) resume.disabled = false
    })
    row.appendChild(resume)
  }
  const back = TutorDom.el('<button class="chip">← 课程列表</button>')
  back.addEventListener('click', () => { location.href = '/' })
  row.appendChild(back)
  $log.appendChild(row)
  chat.scrollToEnd()
}

async function api(path, body) {
  const result = await flowClient.request(path, body)
  if (path === '/flow/start' && result.ok) {
    chat.setFlowFinished(false)
    rememberFlow(result)
    startSse()
  }
  return result
}

function rememberFlow(flow) {
  const url = new URL(location.href)
  url.searchParams.set('flowId', flow.flowId)
  history.replaceState(null, '', url)
}

function startSse() {
  const es = flowClient.connect()
  if (!es) return
  es.onmessage = (event) => {
    const msg = JSON.parse(event.data)
    if (msg.type === 'hello') {
      $log.innerHTML = ''
      chat.reset()
      examOutcome = null
      activeCourse = msg.courseId
      chat.setFlowFinished(msg.status !== 'running' && msg.status !== 'stopping')
      chat.setBusy(msg.status === 'running', '正在恢复考试')
      $state.textContent = msg.courseId ? `大考进行中：${msg.courseId}` : '空闲'
      return
    }
    if (msg.type === 'out') chat.feed(msg.text)
    else if (msg.type === 'err') { if (chat.isOpError(msg.text)) chat.noteOp(msg.text); else $log.appendChild(TutorDom.el(`<div class="errline">${TutorDom.esc(msg.text)}</div>`)) }
    else if (msg.type === 'exit') {
      chat.feed('')
      const closed = chat.closeBubble()
      if (closed) chat.maybeChips(closed)
      chat.setFlowFinished(true)
      chat.clearOp()
      chat.setBusy(false)
      $state.textContent = examOutcome === 'passed' ? '大考通过' : examOutcome === 'failed' ? '大考未通过' : '大考暂停，尚未产生成绩'
      $log.appendChild(TutorDom.el(`<div class="sysline">—— 大考进程退出（code ${msg.code}）——</div>`))
      renderExamDone()
      es.close()
    }
    chat.scrollToEnd()
  }
  es.onerror = () => {
    $state.textContent = '连接中断，重连中…'
    chat.setBusy(false)
  }
}

function send() {
  if (chat.busy || chat.flowFinished) return
  const line = $input.value.trim()
  if (!line) return
  $input.value = ''
  chat.sendLine(line)
}

document.getElementById('send').addEventListener('click', send)
$input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.isComposing) send()
})
document.getElementById('stopBtn').addEventListener('click', async () => {
  await api('/flow/stop')
})

// 起一场大考：milestone 可空——为空时 exam-runner 自选下一个可考里程碑。
async function startExam(courseId, milestoneId) {
  const result = await api('/flow/start', { kind: 'exam', courseId, milestoneId })
  if (!result.ok) {
    $banner.textContent = result.error || '开始大考失败'
    $banner.style.display = 'block'
    return false
  }
  $state.textContent = `大考进行中：${courseId}`
  $banner.style.display = 'none'
  chat.setBusy(true, '正在生成并核对试卷')
  return true
}

const KIND_LABEL = { new: '建档访谈', assess: '摸底', plan: '生成计划', research: '教研', learn: '课堂', exam: '大考', 'practice-gen': '生成实践', practice: '实践' }

// 同一门课程同时只能跑一个流程（不同课程可并行）。同门课被别的流程占用时如实说明并给「结束并开始大考」入口，
// 而不是把别的流程的输出灌进本页。
function renderFlowMismatch(running) {
  if (!flowClient.attach(running)) return
  const runLabel = KIND_LABEL[running.kind] || running.kind
  $state.textContent = `${runLabel}进行中：${running.courseId}`
  $banner.innerHTML = ''
  $banner.appendChild(document.createTextNode(
    `「${running.courseId}」正在进行${runLabel}——同一门课程同时只能跑一个流程。要开始「${wantedCourse}」的大考，得先结束它（进度已存，随时能回来续上）。`))
  const btn = TutorDom.el('<button style="margin-top:8px;cursor:pointer">结束当前流程并开始大考</button>')
  btn.addEventListener('click', async () => {
    btn.disabled = true
    btn.textContent = '正在结束当前流程…'
    await api('/flow/stop')
    for (let i = 0; i < 40; i++) {
      const s = await flowClient.state()
      if (!s) { btn.disabled = false; return }
      if (!(s.flows ?? []).some((flow) => flow.courseId === running.courseId)) break
      await new Promise((r) => setTimeout(r, 500))
    }
    if (await startExam(wantedCourse, wantedMilestone)) startSse()
    else btn.disabled = false
  })
  $banner.appendChild(document.createElement('br'))
  $banner.appendChild(btn)
  $banner.style.display = 'block'
}

// 页面加载：按 URL 的课程找自己的考试流程，决定附着 / 提示切换 / 起新考
;(async () => {
  if (!wantedCourse) {
    $banner.textContent = '缺少 course 参数——请从课程列表点「参加大考」进入。'
    $banner.style.display = 'block'
    startSse()
    return
  }
  const state = await flowClient.state(params.get('flowId'))
  if (!state) return
  if (state.flow && state.flow.kind === 'exam' && state.flow.courseId === wantedCourse
    && (!wantedMilestone || state.flow.milestoneId === wantedMilestone)) {
    if (!flowClient.attach(state.flow)) return
    rememberFlow(state.flow)
    chat.setBusy(state.flow.status === 'running', '正在恢复考试')
    startSse()
    return
  }
  const flows = state.flows ?? []
  const matched = flows.find((flow) => flow.kind === 'exam' && flow.courseId === wantedCourse
    && (!wantedMilestone || flow.milestoneId === wantedMilestone))
  if (matched) {
    if (!flowClient.attach(matched)) return
    rememberFlow(matched)
    $state.textContent = `大考进行中：${matched.courseId}`
    startSse()
    return
  }
  // 同课程被别的流程占用才提示切换；其他课程的并行流程与本页无关。
  const busySameCourse = flows.find((flow) => flow.courseId === wantedCourse)
  if (busySameCourse) {
    renderFlowMismatch(busySameCourse)
    return
  }
  if (params.has('flowId')) {
    chat.setFlowFinished(true)
    chat.setBusy(false)
    $state.textContent = '考试回放已过期'
    $log.appendChild(TutorDom.el('<div class="sysline">可从已保存的试卷和作答继续考试，或返回课程列表查看结果。</div>'))
    renderExamDone()
    return
  }
  await startExam(wantedCourse, wantedMilestone)
  startSse()
})()
</script>
</body>
</html>
