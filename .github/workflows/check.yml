name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/test-annotations.mjs --test-reporter-destination=stdout test/*.test.ts
